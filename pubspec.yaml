name: weatherfy
description: "Weather App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  flutter_svg: ^2.2.3
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  equatable: ^2.0.8
  path_provider: ^2.1.5
  rxdart: ^0.28.0
  dartz: ^0.10.1
  intl: ^0.20.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2

dev_dependencies:
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: SF-Pro
      fonts:
        - asset: assets/fonts/SF_Pro/SF-Pro-Bold.otf
        - asset: assets/fonts/SF_Pro/SF-Pro-Regular.otf
        - asset: assets/fonts/SF_Pro/SF-Pro-Light.otf
        - asset: assets/fonts/SF_Pro/SF-Pro-Medium.otf
        - asset: assets/fonts/SF_Pro/SF-Pro-Thin.otf

